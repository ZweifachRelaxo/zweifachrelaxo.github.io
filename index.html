<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>RelaxoOS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;user-select:none}
body{margin:0;height:100vh;overflow:hidden;font:11px Tahoma,Segoe UI,sans-serif;background:#000}
.scr{position:fixed;inset:0;display:none;z-index:9000;color:#fff;align-items:center;justify-content:center;flex-direction:column}
#off{background:#000;color:#f90;font-size:18px}#bsod{background:#0000aa;font:16px monospace;align-items:flex-start;justify-content:flex-start;padding:30px;white-space:pre-wrap;cursor:pointer}
#desktop{position:fixed;inset:0;display:none;background:linear-gradient(#245edb,#7fb2f0 70%,#cfe6ff)}
.icons{position:absolute;top:8px;left:8px;bottom:40px;display:flex;flex-direction:column;flex-wrap:wrap;gap:6px;align-content:flex-start}
.icon{width:76px;text-align:center;color:#fff;text-shadow:1px 1px 2px #000;padding:4px;border:1px solid transparent}
.icon b{display:block;font-size:32px;font-weight:normal}.icon:hover,.icon.sel{background:rgba(49,106,197,.45);border-color:#6a9ae0}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(#3168d5,#2a5cc4 10%,#245edb 90%,#1941a5);display:flex;align-items:center;z-index:8000}
#start{height:30px;padding:0 20px 0 10px;border:0;border-radius:0 14px 14px 0;background:linear-gradient(#5aa03c,#3c8a22 50%,#2f7a1a);color:#fff;font:italic bold 17px Trebuchet MS,sans-serif;cursor:pointer;text-shadow:1px 1px 2px #000;box-shadow:2px 0 4px rgba(0,0,0,.4)}
#tasks{flex:1;display:flex;gap:3px;padding:0 6px;overflow:hidden}
.tb{background:#3c81f3;color:#fff;border:1px solid #1a4cb0;border-radius:3px;padding:0 8px;height:24px;width:150px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}.tb.on{background:#1e52b7;box-shadow:inset 1px 1px 3px #000}
#tray{background:#0f9bea;color:#fff;height:30px;padding:0 12px;display:flex;align-items:center;gap:10px;border-left:1px solid #0b5fb5}
#menu{position:absolute;bottom:30px;left:0;width:380px;background:#fff;border:2px solid #245edb;border-radius:8px 8px 0 0;display:none;z-index:8001}
#menu .hd{background:linear-gradient(#245edb,#4a88ee);color:#fff;padding:8px;font-weight:bold;font-size:14px;border-radius:6px 6px 0 0}
#menu .cols{display:flex}#menu .c1{width:55%;padding:4px}#menu .c2{width:45%;background:#d3e5fa;padding:4px;border-left:1px solid #95bdee}
.it{padding:7px 10px;cursor:pointer;font-size:12px;position:relative}.it:hover{background:#316ac5;color:#fff}
.sub{display:none;position:absolute;left:100%;bottom:-4px;width:200px;background:#fff;border:1px solid #888;color:#000;box-shadow:3px 3px 6px rgba(0,0,0,.4)}.it:hover>.sub{display:block}
#menu .ft{background:#4a80e0;padding:6px;text-align:right;color:#fff}#menu .ft span{cursor:pointer;margin-left:12px}
.win{position:absolute;background:#ece9d8;border:3px solid #0a3fc8;border-top:0;border-radius:8px 8px 0 0;display:flex;flex-direction:column;box-shadow:3px 3px 10px rgba(0,0,0,.5);min-width:220px;min-height:120px;resize:both;overflow:hidden}
.title{height:28px;background:linear-gradient(#0a5fe8,#0054e3 20%,#0044c8);color:#fff;font-weight:bold;display:flex;align-items:center;padding:0 4px 0 8px;cursor:move;flex-shrink:0;text-shadow:1px 1px #000;font-size:12px}
.title span{flex:1;white-space:nowrap;overflow:hidden}.title button{width:22px;height:22px;margin-left:2px;border:1px solid #fff;border-radius:3px;background:#2a6af0;color:#fff;cursor:pointer;font-weight:bold;padding:0}.title button.x{background:#d9532c}
.body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.mb{display:flex;background:#ece9d8;border-bottom:1px solid #aaa}.mb span{padding:3px 8px;cursor:default}.mb span:hover{background:#316ac5;color:#fff}
.bar{display:flex;gap:4px;padding:3px;border-bottom:1px solid #aaa;align-items:center}.bar button,.dlg button{padding:2px 8px;cursor:pointer;min-width:24px}
.bar input,.dlg input{flex:1;padding:3px;border:1px solid #7f9db9;user-select:text}
.exp{display:flex;flex:1;min-height:0}.side{width:150px;background:linear-gradient(#7ba2e7,#6375d6);padding:10px;color:#fff}.side div{padding:4px;cursor:pointer}.side div:hover{text-decoration:underline}
.files{flex:1;background:#fff;padding:8px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;overflow:auto}
.f{width:84px;text-align:center;padding:4px;height:78px;word-break:break-all}.f b{display:block;font-size:30px;font-weight:normal}.f.sel{background:#316ac5;color:#fff}
.files.list{flex-direction:column;flex-wrap:nowrap}.files.list .f{width:auto;height:auto;text-align:left}.files.list .f b{display:inline;font-size:14px}
.status{padding:3px 8px;border-top:1px solid #aaa}
iframe{flex:1;border:0;background:#fff;width:100%}textarea{flex:1;border:0;padding:6px;font:13px Lucida Console,monospace;resize:none;outline:0;user-select:text}
.dlg{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}.dlg .r{display:flex;gap:8px;width:100%;justify-content:center}
#ctx{position:fixed;background:#fff;border:1px solid #888;box-shadow:3px 3px 6px rgba(0,0,0,.4);z-index:9500;display:none;min-width:140px}
#ctx div{padding:5px 20px;cursor:default}#ctx div:hover{background:#316ac5;color:#fff}
.calc{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px}.calc button{height:30px}.calc input{grid-column:1/6;text-align:right;font-size:18px;height:30px;padding:2px}
.ms{display:grid;gap:0;margin:8px auto;border:3px inset #fff;width:max-content}.ms button{width:24px;height:24px;padding:0;font:bold 12px sans-serif;border:2px outset #fff;background:#c0c0c0}.ms button.o{border:1px solid #888;background:#d8d8d8}
.pal{display:flex;gap:2px;padding:3px;flex-wrap:wrap}.pal i{width:18px;height:18px;border:1px solid #000;cursor:pointer}
table{border-collapse:collapse;width:100%;background:#fff}td,th{padding:3px 6px;border-bottom:1px solid #ddd;text-align:left}tr.sel{background:#316ac5;color:#fff}

.icon{overflow-wrap:anywhere}
/* Skipe */
.zrc .c{background:linear-gradient(#3fc07a,#1b7f46)}
.sk{flex:1;min-height:0;display:flex;background:#f3f6f4;color:#1d2a22;font:13px "Segoe UI",Tahoma,Arial,sans-serif}
.sk input,.sk select,.sk button{font:inherit}
.sk-login{margin:auto;width:290px;padding:22px;background:#fff;border:1px solid #cfd9d2;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.12);text-align:center}
.sk-login h2{margin:0 0 4px;font-size:26px;color:#1b7f46}
.sk-login p{margin:0 0 14px;color:#5b6b61;font-size:12px}
.sk-login input{display:block;width:100%;margin:0 0 8px;padding:8px 10px;border:1px solid #b9c7be;border-radius:5px}
.sk-btn{padding:8px 14px;border:0;border-radius:5px;background:#2e9e5b;color:#fff;font-weight:bold;cursor:pointer}
.sk-btn:hover{background:#27874e}.sk-btn.alt{background:#e3ece6;color:#1d2a22}.sk-btn.alt:hover{background:#d2dfd6}
.sk-err{min-height:18px;margin:6px 0;color:#c0392b;font-size:12px}
.sk-mode{margin-top:10px;font-size:11px;color:#8a6d00;background:#fff6d6;border-radius:4px;padding:4px 6px}
.sk-main{flex:1;min-width:0;display:none}
.sk-side{width:230px;flex:none;display:flex;flex-direction:column;background:#e7efe9;border-right:1px solid #cfd9d2}
.sk-me{padding:10px;display:flex;align-items:center;gap:6px;background:#2e9e5b;color:#fff}
.sk-me b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk-me select{max-width:92px;border:0;border-radius:3px;padding:2px}
.sk-add{display:flex;gap:4px;padding:8px}
.sk-add input{flex:1;min-width:0;padding:6px 8px;border:1px solid #b9c7be;border-radius:5px}
.sk-add button{padding:0 10px}
.sk-note{padding:0 10px 4px;font-size:11px;color:#c0392b;min-height:14px}
.sk-list{flex:1;overflow:auto}
.sk-it{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #d7e2da}
.sk-it:hover{background:#d8e7dd}.sk-it.on{background:#c6e3d0;font-weight:bold}
.sk-dot{width:10px;height:10px;border-radius:50%;background:#9aa5a0;flex:none;border:1px solid rgba(0,0,0,.2)}
.sk-dot.online{background:#2ecc71}.sk-dot.away{background:#f1c40f}.sk-dot.dnd{background:#e74c3c}
.sk-foot{padding:8px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#5b6b61;border-top:1px solid #cfd9d2}
.sk-chat{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.sk-head{padding:12px 16px;font-size:16px;font-weight:bold;background:#fff;border-bottom:1px solid #d7e2da}
.sk-msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sk-m{max-width:78%;align-self:flex-start}.sk-m.mine{align-self:flex-end;text-align:right}
.sk-mt{font-size:11px;color:#6b7b71;margin-bottom:2px}
.sk-b{display:inline-block;padding:7px 11px;border-radius:12px;background:#fff;border:1px solid #d7e2da;text-align:left;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.sk-m.mine .sk-b{background:#d9f2e1;border-color:#b6dfc3}
.sk-inp{display:flex;gap:6px;padding:10px;background:#fff;border-top:1px solid #d7e2da}
.sk-inp input{flex:1;min-width:0;padding:9px 10px;border:1px solid #b9c7be;border-radius:5px}
.sk-inp .sk-btn.alt{font-size:16px;padding:4px 10px}
.sk-emo{display:none;position:absolute;left:10px;bottom:58px;width:230px;padding:6px;background:#fff;border:1px solid #b9c7be;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.2);flex-wrap:wrap}
.sk-emo span{width:28px;height:28px;text-align:center;font-size:18px;cursor:pointer;border-radius:4px;line-height:28px}.sk-emo span:hover{background:#e3ece6}
/* Taskleiste, Tray, Ballon */
#ql{display:flex;align-items:center;gap:2px;padding:0 6px;margin-left:4px;height:30px;border-right:1px solid #1941a5;box-shadow:1px 0 0 rgba(255,255,255,.15)}
#ql button{width:26px;height:24px;border:1px solid transparent;border-radius:3px;background:transparent;cursor:pointer;font-size:16px;padding:0;line-height:1}
#ql button:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45)}
#tray span{cursor:default;font-size:13px}#tray span:hover{filter:brightness(1.25)}
.sep{height:1px;background:#d0d0c8;margin:4px 8px}
.balloon{position:absolute;right:8px;bottom:38px;width:250px;background:#ffffe1;color:#000;border:1px solid #000;border-radius:8px;padding:10px 12px;z-index:8500;box-shadow:2px 2px 6px rgba(0,0,0,.4);cursor:pointer;font-size:12px}
.balloon b{display:block;font-size:13px;margin-bottom:3px}
.balloon:after{content:"";position:absolute;right:30px;bottom:-9px;border:9px solid transparent;border-top-color:#000;border-bottom:0}
/* ===================== XP-Design ===================== */
body{font:11px Tahoma,Verdana,"Segoe UI",sans-serif}
::-webkit-scrollbar{width:17px;height:17px}
::-webkit-scrollbar-track{background:#f3f1ec}
::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#c1d3fb,#a3bcf5 50%,#c1d3fb);border:1px solid #7f9ef0;border-radius:3px}
::-webkit-scrollbar-corner{background:#ece9d8}
/* Hochfahren */
#boot{background:#000;flex-direction:column}
.bl{display:flex;align-items:flex-start;gap:4px;color:#fff;font:italic bold 58px "Franklin Gothic Medium","Trebuchet MS",sans-serif;letter-spacing:-1px}
.bl small{font:italic bold 24px "Trebuchet MS",sans-serif;color:#ff6a1a;margin-top:6px}
.xpb{width:160px;height:18px;margin-top:48px;border:2px solid #b2b2b2;border-radius:6px;padding:2px;overflow:hidden;position:relative}
.xpb i{position:absolute;top:2px;left:-60px;width:57px;height:10px;background:repeating-linear-gradient(90deg,#4a67e8 0 16px,transparent 16px 19px);border-radius:2px;animation:xpl 1.7s linear infinite}
@keyframes xpl{to{left:160px}}
.bc,.bm,.bskip{position:absolute;bottom:22px;color:#fff;font:12px Tahoma,sans-serif}.bc{left:24px}.bm{right:24px;font:italic bold 20px "Trebuchet MS",sans-serif}.bskip{left:50%;transform:translateX(-50%);color:#777}
#welcome{background:radial-gradient(ellipse at 30% 50%,#6d8fe6,#4a6fd0 60%);flex-direction:row;gap:46px}
#welcome:before,#welcome:after{content:"";position:absolute;left:0;right:0;height:78px;background:#00309c}
#welcome:before{top:0;border-bottom:2px solid #c9d6f5}#welcome:after{bottom:0;border-top:2px solid #f09a3b}
#welcome .wl{font:italic bold 44px "Trebuchet MS",sans-serif;text-align:right;line-height:1}#welcome .wl small{display:block;color:#ffb36b;font-size:20px;margin-top:4px}
#welcome .wr{font:italic 46px "Trebuchet MS",sans-serif;padding-left:46px;border-left:2px solid rgba(255,255,255,.6)}
#logoff{background:#5a7edc;font:italic 30px "Trebuchet MS",sans-serif}
/* Desktop */
#desktop{background:#245edb center/cover no-repeat}
.icon{width:78px;padding:4px 2px;border:1px solid transparent;text-align:center;color:#fff;text-shadow:1px 1px 2px #000}
.icon b{display:block;font-size:34px;font-weight:normal;line-height:1.1}
.icon span{display:inline-block;padding:1px 3px;max-width:100%;line-height:1.25}
.icon:hover,.icon.sel{background:none;border-color:transparent}
.icon.sel b{filter:drop-shadow(0 0 0 #316ac5) brightness(.8) sepia(1) hue-rotate(185deg) saturate(3)}
.icon.sel span{background:#316ac5;outline:1px dotted #fff}
/* Fenster */
.win{background:#ece9d8;border:3px solid #7a96df;border-top:0;border-radius:8px 8px 0 0;box-shadow:2px 2px 8px rgba(0,0,0,.45)}
.win.act{border-color:#0831d9}
.title{height:30px;border-radius:8px 8px 0 0;padding:0 5px 0 8px;font:bold 13px "Trebuchet MS",Tahoma,sans-serif;color:#d8e2fa;text-shadow:1px 1px #3a4c80;background:linear-gradient(#7697e7,#7e9ee3 3%,#94afe8 6%,#97b4e9 8%,#82a5e4 14%,#7c9fe2 17%,#7996de 25%,#7b99e1 56%,#82a9e9 81%,#80a5e7 89%,#7b96e1 94%,#7a93df 97%,#abbae3)}
.win.act .title{color:#fff;text-shadow:1px 1px #0f1089;background:linear-gradient(#0058ee,#3593ff 4%,#288eff 6%,#127dff 8%,#036ffc 10%,#0262ee 14%,#0057e5 20%,#0054e3 24%,#0055eb 56%,#005bf5 66%,#026afe 76%,#0062ef 86%,#0052d6 92%,#0040ab 94%,#003092)}
.title button{width:22px;height:22px;margin-left:2px;border:1px solid #fff;border-radius:3px;background:radial-gradient(circle at 90% 90%,#0054e9 0,#2263d5 55%,#4479e4 70%,#a3bbec 90%,#fff 100%);color:#fff;font:bold 12px Tahoma,sans-serif;padding:0;cursor:pointer;line-height:1;text-shadow:none}
.title button:hover{filter:brightness(1.15)}
.title button.x{background:radial-gradient(circle at 90% 90%,#cc4600 0,#dc6527 55%,#cd7546 70%,#ffccb2 90%,#fff 100%)}
.bar button,.dlg button,.calc button{min-width:23px;height:23px;padding:0 10px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#ecebe5 86%,#d8d0c4);color:#000;font:11px Tahoma,sans-serif;cursor:pointer}
.bar button:hover:not(:disabled),.dlg button:hover,.calc button:hover{box-shadow:inset -1px 1px #fff0cf,inset 1px 2px #fdd889,inset -2px 2px #fbc761,inset 2px -2px #e5a01a}
.bar button:active:not(:disabled),.dlg button:active{background:#d8d0c4;box-shadow:none}
.bar button:disabled{color:#aca899;border-color:#c4c4bf}
.bar{background:#ece9d8;border-bottom:1px solid #aca899}
.favs{border-top:1px solid #fff}.favs span{color:#555}.favs button{background:transparent!important;border-color:transparent!important;box-shadow:none!important;padding:0 7px}.favs button:hover{border-color:#8da8d8!important;background:#dfe9fb!important}
.mb{background:#ece9d8;border-bottom:1px solid #aca899}
.side{background:linear-gradient(#7ba2e7,#6375d6)}
/* Taskleiste */
#taskbar{height:30px;background:linear-gradient(#1f2f86,#3165c4 3%,#3682e5 6%,#4490e6 10%,#3883e5 12%,#2b71e0 15%,#2663da 18%,#235bd6 20%,#2258d5 23%,#2157d6 38%,#245ddb 54%,#2562df 86%,#245fdc 89%,#2158d4 92%,#1d4ec0 95%,#1941a5 98%)}
#start{height:30px;padding:0 24px 0 9px;display:flex;align-items:center;gap:5px;border:0;border-radius:0 15px 15px 0;background:linear-gradient(#5eb14b,#3c9a2a 8%,#3d9d2c 20%,#35922a 50%,#2f8a25 80%,#237a1a);box-shadow:inset 0 -2px 4px rgba(0,0,0,.35),2px 0 5px rgba(0,0,0,.45);font:italic bold 20px "Trebuchet MS",sans-serif;color:#fff;text-shadow:1px 1px 3px #1a4a10;cursor:pointer}
#start:hover{filter:brightness(1.1)}
.orb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9f0cf 45%,#8fcf75);color:#2a7a1a;font:bold 14px "Trebuchet MS",sans-serif;font-style:normal;display:flex;align-items:center;justify-content:center;text-shadow:none;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.tb{height:24px;background:linear-gradient(#4a8cf0,#3c81f3 10%,#2f6fdc 90%,#2a63c9);border:1px solid #1a4cb0;border-radius:3px;color:#fff;font:11px Tahoma,sans-serif;box-shadow:inset 0 1px 1px rgba(255,255,255,.3)}
.tb.on{background:linear-gradient(#1a47ad,#1e52b7);box-shadow:inset 1px 1px 3px rgba(0,0,0,.6)}

#panic{display:inline-flex;align-items:center}

/* Startmenü */
#menu{width:385px;background:#fff;border:1px solid #0831d9;border-bottom:0;border-radius:8px 8px 0 0;overflow:visible}

.it:hover{background:#316ac5;color:#fff}#menu .c2 .it:hover{color:#fff}
#menu .ft{background:linear-gradient(#4a8be0,#3070d0 50%,#2c63c4);padding:6px 10px;display:flex;justify-content:flex-end;gap:16px;border-top:1px solid #1e4bb0}

.sub{color:#000;border:1px solid #aca899;box-shadow:2px 2px 3px rgba(0,0,0,.4)}
.sub .it{padding:5px 14px}
#ctx{background:#fff;border:1px solid #aca899;box-shadow:2px 2px 3px rgba(0,0,0,.4);padding:2px}
#ctx div{padding:4px 26px 4px 24px}
.sep{height:1px;background:#d0d0c8;margin:4px 8px}
/* Skipe */
.sk-top{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #d7e2da}
.sk-hw{flex:1;min-width:0}
.sk-top .sk-head{padding:0;border:0;background:none;font-size:16px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let AC;function tone(f,t,d,v=.15){try{AC=AC||new AudioContext();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}}
function chime(){[[523,0],[659,.25],[784,.5],[1047,.8]].forEach(([f,t])=>tone(f,t,1))}function beep(){tone(880,0,.2)}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.style.display='none');$('#desktop').style.display='none';if(id)$('#'+id).style.display='flex'}
/* ===== Hochfahren: Start → Willkommen (kein Login) ===== */
let bootId=0,skipBoot=false;
['boot','welcome'].forEach(i=>$('#'+i).addEventListener('pointerdown',()=>{skipBoot=true}));
async function boot(){
 const id=++bootId;skipBoot=false;
 const wait=async ms=>{const e=Date.now()+ms;while(Date.now()<e&&!skipBoot&&id===bootId)await sleep(30)};
 show('boot');await wait(3800);if(skipBoot)await sleep(300);if(id!==bootId)return;
 show('welcome');await wait(1900);if(skipBoot)await sleep(300);if(id!==bootId)return;
 startDesktop()}
function startDesktop(){show();$('#desktop').style.display='block';chime();loadBg();setTimeout(()=>{if($('#desktop').style.display==='block')balloon('Willkommen bei RelaxoOS','Ihr Computer ist geschützt.',()=>{})},1500)}
document.addEventListener('pointerdown',()=>{try{AC=AC||new AudioContext();if(AC.state==='suspended')AC.resume()}catch(e){}},{once:true});
function closeAll(){document.querySelectorAll('.balloon').forEach(b=>b.remove());document.querySelectorAll('.win').forEach(w=>w.remove());$('#tasks').innerHTML='';hideMenu()}
function logout(){closeAll();show('logoff');setTimeout(startDesktop,1500)}function poweroff(){closeAll();show('off')}
function reboot(){closeAll();boot()}

const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PG=(t,h)=>`<body style="font-family:Tahoma,Verdana,sans-serif;background:#f4f8ff;color:#123;padding:26px;margin:0"><style>a{color:#0645ad}button,input{font:13px Tahoma,sans-serif}input{padding:6px;border:1px solid #7f9db9;width:min(360px,90%)}button{padding:6px 12px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#ecebe5 86%,#d8d0c4);cursor:pointer}.t{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.t a{display:block;width:130px;padding:14px 8px;text-align:center;background:#fff;border:1px solid #b9c9e8;border-radius:6px;text-decoration:none;color:#123}.t a b{display:block;font-size:30px;margin-bottom:6px;font-weight:normal}.m{color:#556;font-size:12px}</style><h2 style="margin-top:0">${t}</h2>${h}</body>`;
const GO=u=>`parent.postMessage({go:'${u}'},'*');return false`;
const FAV=[['▶️ YouTube','about:youtube'],['📖 Wikipedia','https://de.wikipedia.org'],['🗺️ Karten','https://www.openstreetmap.org/export/embed.html'],['📚 Wikibooks','https://de.wikibooks.org'],['📝 Wiktionary','https://de.wiktionary.org']];
const HOME=()=>PG('🌐 Relaxo Browser',`<form onsubmit="var v=this.q.value.trim();if(v)parent.postMessage({go:v},'*');return false"><input name="q" placeholder="Suchbegriff oder Adresse"> <button>Suchen</button></form><div class="t">${FAV.map(([t,u])=>{const i=[...t][0],n=t.slice(i.length).trim();return `<a href="#" onclick="${GO(u)}"><b>${i}</b>${n}</a>`}).join('')}</div><p class="m">Hinweis: Viele Seiten (z. B. Google, Instagram, TikTok) verbieten die Anzeige in fremden Fenstern, dafür gibt es „↗ Neuer Tab“. YouTube-Videos laufen hier, wenn du den Link einfügst.</p>`);
const YT=q=>PG('▶️ YouTube',`<p>Link zu einem Video oder einer Playlist einfügen:</p><form onsubmit="var v=this.u.value.trim();if(v)parent.postMessage({go:v},'*');return false"><input name="u" placeholder="https://www.youtube.com/watch?v=…"> <button>Abspielen</button></form><p style="margin-top:26px">Auf YouTube suchen (öffnet einen neuen Tab):</p><form onsubmit="window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(this.s.value),'_blank');return false"><input name="s" value="${esc(q||'')}" placeholder="Suchbegriff"> <button>Suchen</button></form><p class="m">Suchergebnisse lassen sich nicht einbetten. Öffne das Video auf YouTube, kopiere den Link und füge ihn oben ein, dann läuft es hier im Browser.</p>`);
const SEARCH=q=>{const e=encodeURIComponent(q).replace(/'/g,'%27');return PG('🔎 Suche: '+esc(q),`<div class="t"><a href="#" onclick="${GO('https://de.wikipedia.org/w/index.php?search='+e)}"><b>📖</b>Wikipedia<br><small>hier öffnen</small></a><a href="https://www.youtube.com/results?search_query=${e}" target="_blank" rel="noopener"><b>▶️</b>YouTube<br><small>neuer Tab</small></a><a href="https://duckduckgo.com/?q=${e}" target="_blank" rel="noopener"><b>🦆</b>DuckDuckGo<br><small>neuer Tab</small></a><a href="https://www.google.com/search?q=${e}" target="_blank" rel="noopener"><b>🔍</b>Google<br><small>neuer Tab</small></a></div>`)};
const BLK=u=>{let h=u;try{h=new URL(u).hostname}catch(e){}return PG('🚫 Anzeige nicht möglich',`<p><b>${esc(h)}</b> erlaubt es nicht, in einem fremden Fenster angezeigt zu werden.</p><p><a href="${esc(u)}" target="_blank" rel="noopener">↗ In neuem Tab öffnen</a></p>`)};
const BLOCKED=/(^|\.)(google\.[a-z.]+|bing\.com|duckduckgo\.com|instagram\.com|facebook\.com|twitter\.com|x\.com|tiktok\.com|discord\.com|reddit\.com|netflix\.com|amazon\.[a-z.]+|github\.com|whatsapp\.com|linkedin\.com|twitch\.tv|spotify\.com|paypal\.com)$/i;
function resolve(u){
 u=u.trim();
 if(u==='about:home')return{addr:u,doc:HOME()};
 if(u==='about:youtube')return{addr:u,doc:YT()};
 if(u.startsWith('about:search:')){const q=decodeURIComponent(u.slice(13));return{addr:u,shown:q,doc:SEARCH(q)}}
 if(!/^https?:\/\//i.test(u)){if(/\s/.test(u)||!u.includes('.'))return{addr:'about:search:'+encodeURIComponent(u),shown:u,doc:SEARCH(u)};u='https://'+u}

 const host=x.hostname;
 if(/(^|\.)youtube\.com$|^youtu\.be$|(^|\.)youtube-nocookie\.com$/i.test(host)){
  let id=null;const list=x.searchParams.get('list');
  if(/^youtu\.be$/i.test(host))id=x.pathname.slice(1);
  else if(x.pathname==='/watch')id=x.searchParams.get('v');
  else{const m=x.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{6,})/);if(m)id=m[1]}
  if(id==='videoseries')id=null;
  const tt=x.searchParams.get('t')||x.searchParams.get('start')||'';let t=0;const mm=/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/.exec(tt);if(mm)t=(+mm[1]||0)*3600+(+mm[2]||0)*60+(+mm[3]||0);
  const qp=new URLSearchParams();if(list)qp.set('list',list);if(t>0)qp.set('start',t);const qs=qp.toString()?'?'+qp:'';
  if(id&&/^[\w-]{6,20}$/.test(id))return{addr:u,src:'https://www.youtube-nocookie.com/embed/'+id+qs};
  if(list)return{addr:u,src:'https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(list)+(t>0?'&start='+t:'')};
  return{addr:u,doc:YT(x.searchParams.get('search_query')||'')};
 }
 if(BLOCKED.test(host))return{addr:u,doc:BLK(u)};
 return{addr:u,src:u};
}

function calc(){const b=createWindow('Rechner','🧮',250,270);b.win.style.resize='none';b.innerHTML=`<div class="calc"><input readonly value="0"></div>`;const g=b.firstChild,o=g.firstChild;let cur='0',acc=null,op=null,fresh=true;
 const ap=(a,b,o)=>o==='+'?a+b:o==='-'?a-b:o==='×'?a*b:o==='÷'?(b?a/b:NaN):b;
 '7 8 9 ÷ C 4 5 6 × ± 1 2 3 - √ 0 . = + %'.split(' ').forEach(k=>{const x=document.createElement('button');x.textContent=k;x.onclick=()=>{
  if(/\d/.test(k)){cur=fresh||cur==='0'?k:cur+k;fresh=false}else if(k==='.'){if(!cur.includes('.'))cur+='.';fresh=false}
  else if(k==='C'){cur='0';acc=op=null;fresh=true}else if(k==='±')cur=String(-cur);else if(k==='√')cur=String(Math.sqrt(cur));else if(k==='%')cur=String(cur/100);
  else{const v=parseFloat(cur);acc=op&&!fresh?ap(acc,v,op):v;cur=String(+acc.toFixed(10));op=k==='='?null:k;fresh=true}
  o.value=cur==='NaN'?'Fehler':cur};g.appendChild(x)})}

function snake(){

function game2048(){
 const b=createWindow('2048','🔢',360,470);b.win.style.resize='none';
 b.innerHTML=`<div class="bar"><span class="sc">Punkte: 0</span><span style="flex:1"></span><span class="hs"></span><button class="nw">Neu</button></div><div style="flex:1;display:flex;align-items:center;justify-content:center;background:#faf8ef"><div class="g48" style="display:grid;grid-template-columns:repeat(4,70px);gap:8px;padding:8px;background:#bbada0;border-radius:6px;touch-action:none"></div></div><div class="status">Pfeiltasten / WASD / Wischen · gleiche Zahlen verschmelzen</div>`;
 const g=b.querySelector('.g48'),sc=b.querySelector('.sc'),hsEl=b.querySelector('.hs');
 let B,score,over,best=+(localStorage.getItem('rx_2048')||0);
 const COL={0:'#cdc1b4',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
 const add=()=>{const e=[];B.forEach((r,y)=>r.forEach((v,x)=>{if(!v)e.push([x,y])}));if(!e.length)return;const[x,y]=e[Math.floor(Math.random()*e.length)];B[y][x]=Math.random()<.9?2:4};

 function slide(row){const a=row.filter(Boolean),o=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){o.push(a[i]*2);score+=a[i]*2;i++}else o.push(a[i])}while(o.length<4)o.push(0);return o}
 const tr=M=>M[0].map((_,i)=>M.map(r=>r[i])),sr=r=>slide(r.slice().reverse()).reverse();

async function fbBE(cfg){

 const app=A.initializeApp(cfg),auth=Au.getAuth(app),db=Fs.getFirestore(app);
 const mail=n=>n.toLowerCase()+'@skipe.chat';
 const ERR={'auth/email-already-in-use':'Benutzername bereits vergeben.','auth/invalid-credential':'Benutzername oder Passwort falsch.','auth/wrong-password':'Benutzername oder Passwort falsch.','auth/user-not-found':'Benutzername oder Passwort falsch.','auth/invalid-login-credentials':'Benutzername oder Passwort falsch.','auth/weak-password':'Passwort zu schwach (mind. 6 Zeichen).','auth/too-many-requests':'Zu viele Versuche. Bitte später erneut versuchen.','auth/requires-recent-login':'Bitte melde dich neu an und versuche es erneut.','auth/operation-not-allowed':'Anmeldung per E-Mail/Passwort ist in Firebase nicht aktiviert.'};
 const fe=e=>new Error(ERR[e.code]||('Fehler: '+(e.code||e.message)));
 const prof=async u=>{const d=await Fs.getDoc(Fs.doc(db,'users',u.uid));if(d.exists()){const l=d.data().nameLower;try{const n=await Fs.getDoc(Fs.doc(db,'names',l));if(!n.exists())await Fs.setDoc(Fs.doc(db,'names',l),{uid:u.uid})}catch(e){}}return{uid:u.uid,name:d.exists()?d.data().name:(u.displayName||'Benutzer')}};
 let busy=false;
 const roomRef=t=>t.kind==='room'?Fs.collection(db,'rooms',t.id,'messages'):Fs.collection(db,'chats',t.id,'messages');
 return {
  mode:'',
  init(cb){Au.onAuthStateChanged(auth,async u=>{if(busy)return;cb(u?await prof(u):null)})},
  async register(name,pw){busy=true;let c;try{c=await Au.createUserWithEmailAndPassword(auth,mail(name),pw)}catch(e){busy=false;throw fe(e)}
   try{const l=name.toLowerCase(),bt=Fs.writeBatch(db);bt.set(Fs.doc(db,'users',c.user.uid),{name,nameLower:l,login:l,status:'online',last:Date.now()});bt.set(Fs.doc(db,'names',l),{uid:c.user.uid});await bt.commit();return{uid:c.user.uid,name}}
   catch(e){try{await Au.deleteUser(c.user)}catch(x){}throw new Error(e.code==='permission-denied'?'Name bereits vergeben oder Firestore-Regeln nicht aktuell.':'Registrierung fehlgeschlagen.')}finally{busy=false}},
  async login(name,pw){try{const c=await Au.signInWithEmailAndPassword(auth,mail(name),pw);return await prof(c.user)}catch(e){throw fe(e)}},
  loginName(me){return auth.currentUser?auth.currentUser.email.split('@')[0]:me.name},
  async rename(me,nn){const nl=nn.toLowerCase(),ol=me.name.toLowerCase(),bt=Fs.writeBatch(db);
   if(nl!==ol){bt.set(Fs.doc(db,'names',nl),{uid:me.uid});bt.delete(Fs.doc(db,'names',ol))}
   bt.update(Fs.doc(db,'users',me.uid),{name:nn,nameLower:nl});
   const cs=await Fs.getDocs(Fs.query(Fs.collection(db,'chats'),Fs.where('members','array-contains',me.uid)));
   cs.docs.forEach(d=>bt.update(d.ref,{['names.'+me.uid]:nn}));
   try{await bt.commit()}catch(e){throw new Error(e.code==='permission-denied'?'Dieser Name ist bereits vergeben (oder die Firestore-Regeln sind nicht aktuell).':'Namensänderung fehlgeschlagen.')}
   return{uid:me.uid,name:nn}},
  async deleteAccount(me,pw){const u=auth.currentUser;
   try{await Au.reauthenticateWithCredential(u,Au.EmailAuthProvider.credential(u.email,pw))}catch(e){throw new Error(/credential|password/.test(e.code||'')?'Das Passwort ist falsch.':fe(e).message)}
   busy=true;
   try{
    const del=async qy=>{const r=await Fs.getDocs(qy);for(let i=0;i<r.docs.length;i+=400){const bt=Fs.writeBatch(db);r.docs.slice(i,i+400).forEach(d=>bt.delete(d.ref));await bt.commit()}};
    await del(Fs.query(Fs.collection(db,'rooms','general','messages'),Fs.where('uid','==',me.uid)));
    const cs=await Fs.getDocs(Fs.query(Fs.collection(db,'chats'),Fs.where('members','array-contains',me.uid)));
    for(const c of cs.docs){await del(Fs.query(Fs.collection(db,'chats',c.id,'messages'),Fs.where('uid','==',me.uid)));await Fs.deleteDoc(c.ref)}
    const ud=await Fs.getDoc(Fs.doc(db,'users',me.uid)),bt=Fs.writeBatch(db);
    if(ud.exists())bt.delete(Fs.doc(db,'names',ud.data().nameLower));bt.delete(Fs.doc(db,'users',me.uid));await bt.commit();
    await Au.deleteUser(u);
   }catch(e){throw new Error('Löschen fehlgeschlagen: '+(e.code||e.message))}finally{busy=false}},
  async logout(){await Au.signOut(auth)},
  async setStatus(me,st){await Fs.setDoc(Fs.doc(db,'users',me.uid),{status:st,last:Date.now()},{merge:true})},
  async findUser(name){const r=await Fs.getDocs(Fs.query(Fs.collection(db,'users'),Fs.where('nameLower','==',name.toLowerCase()),Fs.limit(1)));return r.empty?null:{uid:r.docs[0].id,name:r.docs[0].data().name}},
  async openChat(me,o){const id=[me.uid,o.uid].sort().join('_');await Fs.setDoc(Fs.doc(db,'chats',id),{members:[me.uid,o.uid],names:{[me.uid]:me.name,[o.uid]:o.name}},{merge:true});return id},
  watchChats(uid,cb){return Fs.onSnapshot(Fs.query(Fs.collection(db,'chats'),Fs.where('members','array-contains',uid)),s=>cb(s.docs.map(d=>{const c=d.data(),o=c.members.find(x=>x!==uid);return{id:d.id,uid:o,name:c.names[o]}})))},
  watchPresence(uid,cb){return Fs.onSnapshot(Fs.doc(db,'users',uid),d=>{const x=d.data()||{};cb(x.status||'offline',x.last||0)})},
  watchUsers(cb){return Fs.onSnapshot(Fs.query(Fs.collection(db,'users'),Fs.limit(200)),s=>cb(s.docs.map(d=>{const x=d.data();return{uid:d.id,name:x.name,status:x.status||'offline',last:x.last||0}})))},
  watchMessages(t,cb){return Fs.onSnapshot(Fs.query(roomRef(t),Fs.orderBy('ts','desc'),Fs.limit(100)),s=>cb(s.docs.map(d=>{const x=d.data();return{uid:x.uid,name:x.name,text:x.text,ts:x.ts?x.ts.toMillis():Date.now()}}).reverse()))},
  async send(me,t,text){await Fs.addDoc(roomRef(t),{uid:me.uid,name:me.name,text,ts:Fs.serverTimestamp()})}
 }}
