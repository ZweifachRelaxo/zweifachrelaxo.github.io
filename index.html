<style>
*{box-sizing:border-box;user-select:none}
body{margin:0;height:100vh;overflow:hidden;font:11px Tahoma,Segoe UI,sans-serif;background:#000}

.win{position:absolute;background:#ece9d8;border:3px solid #0a3fc8;border-top:0;border-radius:8px 8px 0 0;display:flex;flex-direction:column;box-shadow:3px 3px 10px rgba(0,0,0,.5);min-width:220px;min-height:120px;resize:both;overflow:hidden}
.title{height:28px;background:linear-gradient(#0a5fe8,#0054e3 20%,#0044c8);color:#fff;font-weight:bold;display:flex;align-items:center;padding:0 4px 0 8px;cursor:move;flex-shrink:0;text-shadow:1px 1px #000;font-size:12px}
.title span{flex:1;white-space:nowrap;overflow:hidden}.title button{width:22px;height:22px;margin-left:2px;border:1px solid #fff;border-radius:3px;background:#2a6af0;color:#fff;cursor:pointer;font-weight:bold;padding:0}.title button.x{background:#d9532c}
.body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.mb{display:flex;background:#ece9d8;border-bottom:1px solid #aaa}.mb span{padding:3px 8px;cursor:default}.mb span:hover{background:#316ac5;color:#fff}

.exp{display:flex;flex:1;min-height:0}.side{width:150px;background:linear-gradient(#7ba2e7,#6375d6);padding:10px;color:#fff}.side div{padding:4px;cursor:pointer}.side div:hover{text-decoration:underline}
.files{flex:1;background:#fff;padding:8px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;overflow:auto}
.f{width:84px;text-align:center;padding:4px;height:78px;word-break:break-all}.f b{display:block;font-size:30px;font-weight:normal}.f.sel{background:#316ac5;color:#fff}
.files.list{flex-direction:column;flex-wrap:nowrap}.files.list .f{width:auto;height:auto;text-align:left}.files.list .f b{display:inline;font-size:14px}
.status{padding:3px 8px;border-top:1px solid #aaa}

.dlg{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}.dlg .r{display:flex;gap:8px;width:100%;justify-content:center}

table{border-collapse:collapse;width:100%;background:#fff}td,th{padding:3px 6px;border-bottom:1px solid #ddd;text-align:left}tr.sel{background:#316ac5;color:#fff}

.icon{overflow-wrap:anywhere}

#ql{display:flex;align-items:center;gap:2px;padding:0 6px;margin-left:4px;height:30px;border-right:1px solid #1941a5;box-shadow:1px 0 0 rgba(255,255,255,.15)}

.bar{background:#ece9d8;border-bottom:1px solid #aca899}

.side{background:linear-gradient(#7ba2e7,#6375d6)}

const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let AC;function tone(f,t,d,v=.15){try{AC=AC||new AudioContext();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}}
function chime(){[[523,0],[659,.25],[784,.5],[1047,.8]].forEach(([f,t])=>tone(f,t,1))}function beep(){tone(880,0,.2)}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.style.display='none');$('#desktop').style.display='none';if(id)$('#'+id).style.display='flex'}
/* ===== Hochfahren: Start → Willkommen (kein Login) ===== */
let bootId=0,skipBoot=false;
['boot','welcome'].forEach(i=>$('#'+i).addEventListener('pointerdown',()=>{skipBoot=true}));
async function boot(){
 const id=++bootId;skipBoot=false;
 const wait=async ms=>{const e=Date.now()+ms;while(Date.now()<e&&!skipBoot&&id===bootId)await sleep(30)};
 show('boot');await wait(3800);if(skipBoot)await sleep(300);if(id!==bootId)return;
 show('welcome');await wait(1900);if(skipBoot)await sleep(300);if(id!==bootId)return;
 startDesktop()}
function startDesktop(){show();$('#desktop').style.display='block';chime();loadBg();setTimeout(()=>{if($('#desktop').style.display==='block')balloon('Willkommen bei RelaxoOS','Ihr Computer ist geschützt.',()=>{})},1500)}
document.addEventListener('pointerdown',()=>{try{AC=AC||new AudioContext();if(AC.state==='suspended')AC.resume()}catch(e){}},{once:true});
function closeAll(){document.querySelectorAll('.balloon').forEach(b=>b.remove());document.querySelectorAll('.win').forEach(w=>w.remove());$('#tasks').innerHTML='';hideMenu()}
function logout(){closeAll();show('logoff');setTimeout(startDesktop,1500)}function poweroff(){closeAll();show('off')}
function reboot(){closeAll();boot()}
function bluescreen(){closeAll();show('bsod');$('#bsod').textContent='A problem has been detected and RelaxoOS has been shut down to prevent damage to your computer.\n\nUSER_TRIED_TOO_MUCH_STUFF\n\nIf this is the first time you\'ve seen this stop error screen, restart your computer.\n\n*** STOP: 0x0000007B (0xF78D2524,0xC0000034,0x00000000)\n\n[ Klicken zum Neustart ]'}
$('#desktop').addEventListener('mousedown',e=>{if(!e.target.closest('#menu')&&e.target.id!=='start')hideMenu();hideCtx();if(e.target.id==='desktop'||e.target.id==='icons')document.querySelectorAll('.icon').forEach(i=>i.classList.remove('sel'))});
setInterval(()=>{const d=new Date();$('#clock').textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});$('#clock').title=d.toLocaleDateString('de-DE',{dateStyle:'full'})},1000);
function toggleMenu(){const m=$('#menu');if(m.style.display!=='block')buildL();m.style.display=m.style.display==='block'?'none':'block'}function hideMenu(){$('#menu').style.display='none'}
function ctx(x,y,items){const c=$('#ctx');c.innerHTML='';items.forEach(([l,f])=>{const d=document.createElement('div');d.textContent=l;d.onmousedown=e=>{e.stopPropagation();hideCtx();f()};c.appendChild(d)});c.style.left=Math.min(x,innerWidth-170)+'px';c.style.top=Math.min(y,innerHeight-items.length*26-10)+'px';c.style.display='block';const r=c.getBoundingClientRect();if(r.bottom>innerHeight-4)c.style.top=Math.max(0,innerHeight-r.height-6)+'px';if(r.right>innerWidth-4)c.style.left=Math.max(0,innerWidth-r.width-6)+'px'}
function hideCtx(){$('#ctx').style.display='none'}document.addEventListener('mousedown',e=>{if(!e.target.closest('#ctx'))hideCtx()});
function dctx(e){if(e.target.closest('.win,#menu,#taskbar'))return false;e.preventDefault();ctx(e.clientX,e.clientY,[['Aktualisieren',()=>{}],['Neuer Ordner',()=>{mk(DESK,'Neuer Ordner',D({}));drawIcons()}],['Neue Textdatei',()=>{mk(DESK,'Neu.txt',F(''));drawIcons()}],['Eigenschaften',openDisplay]]);return false}

/* ===== Touch & Mobil ===== */
let lastPT='mouse';
document.addEventListener('pointerdown',e=>{lastPT=e.pointerType||'mouse'},true);
const isTapMode=()=>lastPT!=='mouse';
const isSmall=()=>innerWidth<760||innerHeight<520;
const isTouchDev=()=>matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&!matchMedia('(pointer:fine)').matches);
const getTbh=()=>parseFloat(getComputedStyle($('#taskbar')).height)||30;
function applyMode(){document.body.classList.toggle('touch',isTouchDev());document.body.classList.toggle('small',isSmall());
 const lim=innerHeight-getTbh()-34;document.querySelectorAll('.win:not(.mxd)').forEach(w=>{const l=parseFloat(w.style.left)||0,t=parseFloat(w.style.top)||0;if(l>innerWidth-80)w.style.left=Math.max(0,innerWidth-80)+'px';if(t>lim)w.style.top=Math.max(0,lim)+'px'})}
addEventListener('resize',applyMode);addEventListener('orientationchange',applyMode);applyMode();
function toggleFS(){const el=document.documentElement;try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const r=el.requestFullscreen||el.webkitRequestFullscreen;if(r){const pr=r.call(el);if(pr&&pr.catch)pr.catch(()=>{})}}}catch(e){}}
/* Tippen öffnet Dateien/Icons (statt Doppelklick) */
document.addEventListener('click',e=>{if(!isTapMode())return;const el=e.target.closest('.f,.icon');if(el&&typeof el.ondblclick==='function')el.ondblclick(e)});
/* Langes Drücken = Rechtsklick */
(function(){let tm=null,sx=0,sy=0,fired=false;
 document.addEventListener('touchstart',e=>{fired=false;clearTimeout(tm);if(e.touches.length!==1)return;const t=e.touches[0],tg=e.target;
  if(tg.closest&&tg.closest('input,textarea,canvas,iframe,select,#android,.sk-msgs,.title,.rz,#start'))return;

 b.innerHTML=`<div class="bar"><button class="pen">✏️ Stift</button><button class="er">🧽 Radierer</button><button class="fl">🪣 Füllen</button>Größe <input type="range" min="1" max="30" value="3" style="flex:0 0 90px"><button class="cl">Neu</button><button class="sv">Speichern</button></div><div class="pal"></div><div style="flex:1;overflow:auto;background:#808080;padding:4px"><canvas width="900" height="600" style="background:#fff;cursor:crosshair"></canvas></div>`;
 const cv=b.querySelector('canvas'),c=cv.getContext('2d');c.lineCap='round';c.lineJoin='round';cv.style.touchAction='none';let col='#000',tool='pen',sz=3,dr=false;
 cols.forEach(k=>{const i=document.createElement('i');i.style.background=k;i.onclick=()=>{col=k;tool=tool==='er'?'pen':tool};b.querySelector('.pal').appendChild(i)});
 b.querySelector('.pen').onclick=()=>tool='pen';b.querySelector('.er').onclick=()=>tool='er';b.querySelector('.fl').onclick=()=>tool='fl';b.querySelector('input').oninput=e=>sz=+e.target.value;
 b.querySelector('.cl').onclick=()=>c.clearRect(0,0,900,600);b.querySelector('.sv').onclick=()=>ask('Dateiname:','Bild.png',k=>{if(k)mk(['C:','Eigene Dateien','Bilder'],k.endsWith('.png')?k:k+'.png',F(cv.toDataURL()))});
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 function fill(x,y){const im=c.getImageData(0,0,900,600),d=im.data,i0=(Math.floor(y)*900+Math.floor(x))*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],cc=document.createElement('canvas').getContext('2d');cc.fillStyle=col;cc.fillRect(0,0,1,1);const f=cc.getImageData(0,0,1,1).data;if(t[0]===f[0]&&t[1]===f[1]&&t[2]===f[2]&&t[3]===255)return;const st=[[Math.floor(x),Math.floor(y)]];
  while(st.length){const[px,py]=st.pop();if(px<0||py<0||px>=900||py>=600)continue;const i=(py*900+px)*4;if(d[i]!==t[0]||d[i+1]!==t[1]||d[i+2]!==t[2]||d[i+3]!==t[3])continue;d[i]=f[0];d[i+1]=f[1];d[i+2]=f[2];d[i+3]=255;st.push([px+1,py],[px-1,py],[px,py+1],[px,py-1])}c.putImageData(im,0,0)}
 cv.onpointerdown=e=>{const[x,y]=pos(e);if(tool==='fl'){fill(x,y);return}try{cv.setPointerCapture(e.pointerId)}catch(z){}dr=true;c.beginPath();c.moveTo(x,y)};
 cv.onpointermove=e=>{if(!dr)return;const[x,y]=pos(e);c.strokeStyle=tool==='er'?'#fff':col;c.lineWidth=tool==='er'?sz*3:sz;c.lineTo(x,y);c.stroke()};
 cv.onpointerup=cv.onpointercancel=()=>{dr=false}}

/* Minenfeld */
function mines(){const b=createWindow('Minenfeld','💣',260,330);b.win.style.resize='none';const N=9,M=10;let cells,over,left,fm=false;function flag(i){if(over||cells[i].o)return;cells[i].f=!cells[i].f;cells[i].el.textContent=cells[i].f?'🚩':''}
 b.innerHTML=`<div class="bar" style="justify-content:space-between"><span class="cnt">💣 10</span><button class="fg" title="Flaggen-Modus">🚩</button><button class="rs">🙂</button></div><div class="ms" style="grid-template-columns:repeat(${N},24px)"></div>`;const g=b.querySelector('.ms'),rs=b.querySelector('.rs');b.querySelector('.fg').onclick=e=>{fm=!fm;e.currentTarget.style.background=fm?'#f9d96b':''};
 function init(){g.innerHTML='';over=false;left=N*N-M;rs.textContent='🙂';cells=[];const mset=new Set();while(mset.size<M)mset.add(Math.floor(Math.random()*N*N));
  for(let i=0;i<N*N;i++){const el=document.createElement('button');cells.push({el,m:mset.has(i),o:false,f:false,i});g.appendChild(el);el.onclick=()=>fm?flag(i):open(i);el.oncontextmenu=e=>{e.preventDefault();flag(i)}}}
 const nb=i=>{const x=i%N,y=Math.floor(i/N),r=[];for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const a=x+dx,c=y+dy;if((dx||dy)&&a>=0&&c>=0&&a<N&&c<N)r.push(c*N+a)}return r};
 function open(i){const c=cells[i];if(over||c.o||c.f)return;c.o=true;c.el.classList.add('o');
  if(c.m){over=true;c.el.textContent='💥';cells.forEach(k=>{if(k.m&&k!==c)k.el.textContent='💣'});rs.textContent='😵';return}
  const k=nb(i).filter(j=>cells[j].m).length;c.el.textContent=k||'';c.el.style.color=['','#00f','#080','#f00','#008','#800','#088','#000','#888'][k];
  if(!k)nb(i).forEach(open);if(--left===0){over=true;rs.textContent='😎'}}
 rs.onclick=init;init()}

 const upd=()=>{if(!document.body.contains(b))return clearInterval(iv);const ws=[...document.querySelectorAll('.win')].filter(w=>w!==b.win);tbd.innerHTML='';ws.forEach(w=>{const r=document.createElement('tr');r.innerHTML=`<td>${w.dataset.t}</td>`;if(w===s)r.className='sel';r.onclick=()=>{s=w;upd()};tbd.appendChild(r)});b.querySelector('.s').textContent=ws.length+' Anwendung(en)'},iv=setInterval(upd,1500);

const BGS={'Sakura':'','Wiese':WALL_BLISS,'Dunkelblau':'#1a3c8c','Schwarz':'#000','Blaugrün':'#008080','Sonnenuntergang':'linear-gradient(#2b1055,#d4506c 60%,#f8b66a)'};
/* ===== Fallende Kirschblüten (nur beim Sakura-Hintergrund) ===== */
const PET={on:false,raf:0,ps:[],w:0,h:0};
const newPetal=top=>({x:Math.random()*PET.w,y:top?Math.random()*PET.h:-12,s:5+Math.random()*7,vy:.45+Math.random()*.8,vx:-.25+Math.random()*.6,r:Math.random()*6.28,vr:(Math.random()-.5)*.04,ph:Math.random()*6.28,a:.45+Math.random()*.45});
function petalsOn(on){const c=$('#petals');PET.on=on&&!matchMedia('(prefers-reduced-motion: reduce)').matches;c.style.display=PET.on?'block':'none';if(PET.on&&!PET.raf)petalStep()}
function petalStep(){
 const c=$('#petals'),x=c.getContext('2d');PET.raf=0;if(!PET.on)return;
 if(c.width!==innerWidth||c.height!==innerHeight){c.width=PET.w=innerWidth;c.height=PET.h=innerHeight}
 if(!PET.ps.length)for(let i=0;i<34;i++)PET.ps.push(newPetal(true));
 if($('#desktop').style.display==='block'){
  x.clearRect(0,0,PET.w,PET.h);const t=Date.now()/1000;
  PET.ps.forEach((p,i)=>{p.y+=p.vy;p.x+=p.vx+Math.sin(t*.9+p.ph)*.5;p.r+=p.vr;if(p.y>PET.h+14||p.x<-20||p.x>PET.w+20)PET.ps[i]=newPetal(false);
   x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle='rgba(255,186,208,'+p.a+')';x.beginPath();x.ellipse(0,0,p.s,p.s*.55,0,0,6.283);x.fill();x.fillStyle='rgba(255,226,236,'+p.a*.6+')';x.beginPath();x.ellipse(-p.s*.15,-p.s*.1,p.s*.45,p.s*.2,0,0,6.283);x.fill();x.restore()})}
 PET.raf=requestAnimationFrame(petalStep)}

function loadBg(){const v=localStorage.getItem('rxbg2');$('#desktop').style.background=v?v:WALL;petalsOn(!v);drawIcons()}
function openDisplay(){const b=createWindow('Eigenschaften von Anzeige','🖥️',320,260);b.className+=' dlg';b.innerHTML=`<div style="font-size:13px">Desktophintergrund:</div><div class="r" style="flex-wrap:wrap"></div>`;
 Object.entries(BGS).forEach(([k,v])=>{const x=document.createElement('button');x.textContent=k;x.onclick=()=>{$('#desktop').style.background=v||WALL;petalsOn(!v);try{localStorage.setItem('rxbg2',v)}catch(e){}};b.querySelector('.r').appendChild(x)})}
function control(){const b=createWindow('Systemsteuerung','⚙️',420,280);b.innerHTML=`<div class="files"></div>`;[['🖥️','Anzeige',openDisplay],['💻','System',sysinfo],['📊','Task-Manager',taskmgr],['🕐','Datum/Uhrzeit',()=>msg(new Date().toLocaleString('de-DE'),'Datum und Uhrzeit','🕐')]].forEach(([i,t,f])=>{const e=document.createElement('div');e.className='f';e.innerHTML=`<b>${i}</b>${t}`;e.ondblclick=f;b.firstChild.appendChild(e)})}
const APPS={uno:uno,vier:vierGewinnt,galgen:galgen,snake:snake,spiele:spiele,'2048':game2048,memory:memory,tictactoe:tictactoe,notepad:()=>notepad('Unbenannt',''),editor:()=>notepad('Unbenannt',''),calc:calc,rechner:calc,mspaint:paint,paint:paint,iexplore:browser,explorer:()=>openExplorer([]),winmine:mines,taskmgr:taskmgr,control:control,bluescreen:bluescreen,cmd:()=>msg('Die Eingabeaufforderung ist in dieser Version nicht verfügbar.','cmd')};

function anrufliste(){
 const b=createWindow('Anrufliste','📞',540,360);const NUM='015792321671';
 const R=[['miss','Heute, 14:32','–'],['in','Gestern, 20:15','3:12'],['out','Gestern, 09:48','0:48']];
 const T={miss:['❌','Verpasst'],in:['📥','Eingehend'],out:['📤','Ausgehend']};
 b.innerHTML=`<div class="bar"><button class="f1">Alle Anrufe</button><button class="f2">Verpasste</button><span style="flex:1"></span><button disabled title="Nur zur Ansicht">📞 Anrufen</button></div><div style="flex:1;overflow:auto;background:#fff"><table><thead><tr><th>Art</th><th>Nummer</th><th>Zeit</th><th>Dauer</th></tr></thead><tbody></tbody></table></div><div class="status">Nur zur Ansicht – Anrufe sind hier nicht möglich.</div>`;
 let f=null,sel=-1;const tb=b.querySelector('tbody');
 function draw(){tb.innerHTML='';R.forEach((r,i)=>{if(f&&r[0]!==f)return;const tr=document.createElement('tr');if(i===sel)tr.className='sel';tr.innerHTML=`<td>${T[r[0]][0]} ${T[r[0]][1]}</td><td>${NUM}</td><td>${r[1]}</td><td>${r[2]}</td>`;tr.onclick=()=>{sel=i;draw()};tr.ondblclick=()=>msg('Anrufe sind nur zur Ansicht. Es kann nichts gewählt werden.','Anrufliste','📞');tb.appendChild(tr)})}
 b.querySelector('.f1').onclick=()=>{f=null;draw()};b.querySelector('.f2').onclick=()=>{f='miss';draw()};draw()}

/* ===== Panic-Button: Fake-Android-Update im Vollbild ===== */
function panic(){
 if(document.getElementById('android'))return;
 const el=document.documentElement;
 try{const r=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;if(r){const pr=r.call(el);if(pr&&pr.catch)pr.catch(()=>{})}}catch(e){}
 const oldTitle=document.title;document.title='Systemupdate';

 function slide(row){const a=row.filter(Boolean),o=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){o.push(a[i]*2);score+=a[i]*2;i++}else o.push(a[i])}while(o.length<4)o.push(0);return o}

/* ===================== Mehr Spiele: UNO, Vier gewinnt, Galgenmännchen ===================== */
const gClone=o=>JSON.parse(JSON.stringify(o));
const gShuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---- UNO ---- */
function unoInit(n){const d=[];for(const c of 'RGBY'){d.push(c+'0');for(let v=1;v<=9;v++)d.push(c+v,c+v);for(const a of ['S','R','D'])d.push(c+a,c+a)}for(let i=0;i<4;i++)d.push('W0','W4');gShuf(d);
 const hands=[];for(let i=0;i<n;i++)hands.push(d.splice(0,7));
 const k=d.findIndex(c=>c[0]!=='W'&&/\d/.test(c[1]));const top=d.splice(k,1)[0];
 return{deck:d,disc:[top],hands,turn:0,dir:1,col:top[0],dr:false,w:-1,msg:'Los geht\'s!'}}
const unoCan=(c,s)=>{const t=s.disc[s.disc.length-1];return c[0]==='W'||c[0]===s.col||(t[0]!=='W'&&c.slice(1)===t.slice(1))};
const unoNext=(s,k=1)=>{const n=s.hands.length;return((s.turn+s.dir*k)%n+n)%n};
function unoDrawN(s,p,k){for(let i=0;i<k;i++){if(!s.deck.length){const top=s.disc.pop();s.deck=gShuf(s.disc);s.disc=[top];if(!s.deck.length)break}s.hands[p].push(s.deck.pop())}}
function unoPlay(s0,p,i,col){const s=gClone(s0);if(s.w>=0||s.turn!==p)return null;const c=s.hands[p][i];if(!c||!unoCan(c,s))return null;if(s.dr&&i!==s.hands[p].length-1)return null;
 s.hands[p].splice(i,1);s.disc.push(c);s.dr=false;s.col=c[0]==='W'?(col||'R'):c[0];
 if(s.hands[p].length===0){s.w=p;s.msg='🎉 Letzte Karte gespielt!';return s}
 let skip=0,msg='';const v=c.slice(1);
 if(c==='W4'){unoDrawN(s,unoNext(s),4);skip=1;msg='+4! '}
 else if(v==='D'){unoDrawN(s,unoNext(s),2);skip=1;msg='+2! '}
 else if(v==='S'){skip=1;msg='Aussetzen! '}
 else if(v==='R'){if(s.hands.length===2)skip=1;else s.dir*=-1;msg='Richtungswechsel! '}
 s.turn=unoNext(s,1+skip);if(s.hands[p].length===1)msg+='UNO!';s.msg=msg;return s}
function unoDraw(s0,p){const s=gClone(s0);if(s.w>=0||s.turn!==p||s.dr)return null;unoDrawN(s,p,1);const h=s.hands[p],c=h[h.length-1];
 if(c&&unoCan(c,s)){s.dr=true;s.msg='Gezogen – spielen oder passen'}else{s.turn=unoNext(s);s.msg='Gezogen – kein passender Zug'}return s}
function unoPass(s0,p){const s=gClone(s0);if(s.w>=0||s.turn!==p||!s.dr)return null;s.dr=false;s.turn=unoNext(s);s.msg='Gepasst';return s}
function unoBot(s){const p=s.turn,h=s.hands[p];
 const idx=h.map((c,i)=>i).filter(i=>unoCan(h[i],s)&&(!s.dr||i===h.length-1));
 if(idx.length){const nw=idx.filter(i=>h[i][0]!=='W'),pool=nw.length?nw:idx,i=pool[Math.floor(Math.random()*pool.length)];
  const cnt={R:0,G:0,B:0,Y:0};h.forEach((c,j)=>{if(j!==i&&c[0]!=='W')cnt[c[0]]++});const col=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];return unoPlay(s,p,i,col)}
 return s.dr?unoPass(s,p):unoDraw(s,p)}
function unoUI(box,names,me,put){

 const sym=c=>{const v=c.slice(1);return c==='W0'?'★':c==='W4'?'+4':v==='S'?'⊘':v==='R'?'⇄':v==='D'?'+2':v};
 const mk=(c,big)=>{const e=document.createElement('div');e.className='ucard'+(big?' big':'');e.textContent=sym(c);e.style.background=c[0]==='W'?'conic-gradient(#d32f2f 0 25%,#f9a825 0 50%,#2e7d32 0 75%,#1565c0 0)':UC[c[0]];if(c[0]==='Y')e.style.color='#222';return e};

  const myTurn=s.turn===me&&s.w<0;

  const top=s.disc[s.disc.length-1],tp=q('.up');tp.innerHTML='';const tc=mk(top,true);tc.style.boxShadow='0 0 0 5px '+UC[s.col];tp.appendChild(tc);
  const f=q('.uf');f.innerHTML='';const dk=document.createElement('div');dk.className='ucard big back'+(myTurn&&!s.dr?' ok':' no');dk.innerHTML='UNO<br><small>'+s.deck.length+'</small>';dk.onclick=()=>{if(myTurn&&!s.dr)go(unoDraw(s,me))};f.appendChild(dk);
  if(myTurn&&s.dr){const pb=document.createElement('button');pb.textContent='Passen';pb.style.cssText='margin-left:6px;padding:8px 14px';pb.onclick=()=>go(unoPass(s,me));f.appendChild(pb)}
  const m=q('.um');m.innerHTML='';const tx=document.createElement('span');
  if(s.w>=0){tx.textContent=(s.w===me?'🎉 Du gewinnst!':'😢 '+names[s.w]+' gewinnt.');const nb=document.createElement('button');nb.textContent='Neue Runde';nb.style.cssText='margin-left:10px;padding:4px 10px';nb.onclick=()=>put(unoInit(names.length));m.append(tx,nb)}
  else{tx.textContent=(myTurn?'Du bist dran':names[s.turn]+' ist dran')+(s.msg?' – '+s.msg:'');m.appendChild(tx)}
  const h=q('.uh');h.innerHTML='';const hand=s.hands[me];
  hand.map((c,i)=>[c,i]).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([c,i])=>{const e=mk(c);const ok=myTurn&&unoCan(c,s)&&(!s.dr||i===hand.length-1);e.classList.add(ok?'ok':'no');
   if(ok)e.onclick=()=>{if(c[0]==='W'){wild=i;const cp=q('.ucp');cp.style.display='flex'}else go(unoPlay(s,me,i))};h.appendChild(e)})}
 const cp=q('.ucp');'RGBY'.split('').forEach(k=>{const i=document.createElement('i');i.style.background=UC[k];i.onclick=()=>{if(wild>=0)go(unoPlay(last,me,wild,k))};cp.appendChild(i)});
 return{render}}

function c4Init(){return{b:Array(42).fill(-1),t:0,w:-1}}
const c4Row=(b,c)=>{for(let r=5;r>=0;r--)if(b[r*7+c]<0)return r;return -1};
function c4Win(b,r,c,p){for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let n=1;for(const g of[1,-1]){let rr=r+dr*g,cc=c+dc*g;while(rr>=0&&rr<6&&cc>=0&&cc<7&&b[rr*7+cc]===p){n++;rr+=dr*g;cc+=dc*g}}if(n>=4)return true}return false}
function c4Drop(s0,p,c){const s=gClone(s0);if(s.w>=0||s.t!==p)return null;const r=c4Row(s.b,c);if(r<0)return null;s.b[r*7+c]=p;if(c4Win(s.b,r,c,p))s.w=p;else if(s.b.every(x=>x>=0))s.w=2;s.t=1-p;return s}
function c4Ai(s){const ok=[0,1,2,3,4,5,6].filter(c=>s.b[c]<0);
 const wins=(p,c)=>{const b=s.b.slice(),r=c4Row(b,c);b[r*7+c]=p;return c4Win(b,r,c,p)};
 for(const c of ok)if(wins(1,c))return c;for(const c of ok)if(wins(0,c))return c;
 const safe=ok.filter(c=>{const b=s.b.slice(),r=c4Row(b,c);b[r*7+c]=1;if(r>0){b[(r-1)*7+c]=0;return !c4Win(b,r-1,c,0)}return true});
 const pool=safe.length?safe:ok;pool.sort((a,b)=>Math.abs(a-3)-Math.abs(b-3)+(Math.random()-.5));return pool[0]}
function c4UI(box,names,me,put){
 box.innerHTML='<div class="um c4s" style="background:#0d47a1;width:100%"></div><div class="c4b" style="padding:10px;background:#1565c0;border-radius:10px;margin:10px;align-self:center"></div>';
 const q=x=>box.querySelector(x),CO=['#e53935','#fdd835'];
 function render(s){const st=q('.c4s');st.innerHTML='';const tx=document.createElement('span');const myTurn=s.t===me&&s.w<0;
  if(s.w>=0){tx.textContent=s.w===2?'Unentschieden!':(s.w===me?'🎉 Du hast gewonnen!':'😢 '+names[s.w]+' hat gewonnen.');const nb=document.createElement('button');nb.textContent='Neue Runde';nb.style.cssText='margin-left:10px;padding:4px 10px';nb.onclick=()=>put(c4Init());st.append(tx,nb)}
  else{tx.textContent=(myTurn?'Du bist dran ':names[s.t]+' ist dran ')+(s.t===0?'🔴':'🟡');st.appendChild(tx)}
  const g=q('.c4b');g.innerHTML='';g.style.cssText+=';display:grid;grid-template-columns:repeat(7,min(46px,11vw));gap:5px';
  for(let c=0;c<7;c++){const bt=document.createElement('button');bt.textContent='▼';bt.style.cssText='height:30px;border:0;border-radius:6px;background:'+(myTurn&&s.b[c]<0?'#fff':'#90a4c8')+';cursor:'+(myTurn?'pointer':'default');bt.onclick=()=>{if(myTurn){const s2=c4Drop(s,me,c);if(s2)put(s2)}};g.appendChild(bt)}
  s.b.forEach(v=>{const d=document.createElement('div');d.style.cssText='aspect-ratio:1;border-radius:50%;background:'+(v<0?'#0d47a1':CO[v])+';box-shadow:inset 0 3px 6px rgba(0,0,0,.4)';g.appendChild(d)})}
 return{render}}

/* ---- Tic-Tac-Toe (Mehrspieler) ---- */
function tttInit(){return{b:Array(9).fill(''),t:0,w:-1}}
function tttMove(s0,p,i){const s=gClone(s0);if(s.w>=0||s.t!==p||s.b[i])return null;s.b[i]=p?'O':'X';
 if([[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(r=>r.every(k=>s.b[k]===s.b[i])))s.w=p;else if(s.b.every(Boolean))s.w=2;s.t=1-p;return s}
function tttUI(box,names,me,put){
 box.innerHTML='<div class="um ttm" style="background:#1565c0;width:100%"></div><div class="ttg" style="display:grid;grid-template-columns:repeat(3,80px);gap:6px;margin:16px auto;align-self:center"></div>';
 const q=x=>box.querySelector(x);
 function render(s){const m=q('.ttm');m.innerHTML='';const tx=document.createElement('span');const myTurn=s.t===me&&s.w<0;
  if(s.w>=0){tx.textContent=s.w===2?'Unentschieden!':(s.w===me?'🎉 Du hast gewonnen!':'😢 '+names[s.w]+' hat gewonnen.');const nb=document.createElement('button');nb.textContent='Neue Runde';nb.style.cssText='margin-left:10px;padding:4px 10px';nb.onclick=()=>put(tttInit());m.append(tx,nb)}
  else{tx.textContent=(myTurn?'Du bist dran':names[s.t]+' ist dran')+' · Du bist '+(me?'O':'X');m.appendChild(tx)}
  const g=q('.ttg');g.innerHTML='';s.b.forEach((v,i)=>{const e=document.createElement('button');e.style.cssText='width:80px;height:80px;font-size:42px;border:2px solid #7f9db9;border-radius:6px;background:#f4f8ff;cursor:pointer;padding:0;color:'+(v==='X'?'#1a4cb0':'#c0392b');e.textContent=v;e.onclick=()=>{const s2=tttMove(s,me,i);if(s2)put(s2)};g.appendChild(e)})}
 return{render}}

/* Backend 2: Firebase (echter Online-Chat) */
async function fbBE(cfg){
 const B='https://www.gstatic.com/firebasejs/10.12.2/';
 const [A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
 const app=A.initializeApp(cfg),auth=Au.getAuth(app),db=Fs.getFirestore(app);
 const mail=n=>n.toLowerCase()+'@skipe.chat';
 const ERR={'auth/email-already-in-use':'Benutzername bereits vergeben.','auth/invalid-credential':'Benutzername oder Passwort falsch.','auth/wrong-password':'Benutzername oder Passwort falsch.','auth/user-not-found':'Benutzername oder Passwort falsch.','auth/invalid-login-credentials':'Benutzername oder Passwort falsch.','auth/weak-password':'Passwort zu schwach (mind. 6 Zeichen).','auth/too-many-requests':'Zu viele Versuche. Bitte später erneut versuchen.','auth/requires-recent-login':'Bitte melde dich neu an und versuche es erneut.','auth/operation-not-allowed':'Anmeldung per E-Mail/Passwort ist in Firebase nicht aktiviert.'};
 const fe=e=>new Error(ERR[e.code]||('Fehler: '+(e.code||e.message)));
 const stOf=x=>x.banned?'banned':(x.approved===false?'pending':'ok');
 const delQ=async qy=>{const r=await Fs.getDocs(qy);for(let i=0;i<r.docs.length;i+=400){const bt=Fs.writeBatch(db);r.docs.slice(i,i+400).forEach(d=>bt.delete(d.ref));await bt.commit()}};
 const prof=async u=>{const d=await Fs.getDoc(Fs.doc(db,'users',u.uid));
  if(d.exists()){const x=d.data(),l=x.nameLower;try{const n=await Fs.getDoc(Fs.doc(db,'names',l));if(!n.exists())await Fs.setDoc(Fs.doc(db,'names',l),{uid:u.uid})}catch(e){}return{uid:u.uid,name:x.name,st:stOf(x)}}
  const login=(u.email||'').split('@')[0];if(!login)return null;const adm=login===ADMIN_LOGIN;
  try{const bt=Fs.writeBatch(db);bt.set(Fs.doc(db,'users',u.uid),{name:login,nameLower:login,login,status:'online',last:Date.now(),created:Date.now(),approved:adm});bt.set(Fs.doc(db,'names',login),{uid:u.uid});await bt.commit();return{uid:u.uid,name:login,st:adm?'ok':'pending'}}catch(e){return null}};
 let busy=false;
 const roomRef=t=>t.kind==='room'?Fs.collection(db,'rooms',t.id,'messages'):Fs.collection(db,'chats',t.id,'messages');
 return {
  mode:'',
  init(cb){Au.onAuthStateChanged(auth,async u=>{if(busy)return;const pr=u?await prof(u):null;if(u&&!pr){try{await Au.signOut(auth)}catch(e){}}cb(pr)})},
  async register(name,pw){busy=true;let c;try{c=await Au.createUserWithEmailAndPassword(auth,mail(name),pw)}catch(e){busy=false;throw fe(e)}
   try{const l=name.toLowerCase(),uid=c.user.uid,bt=Fs.writeBatch(db);let old=null;
    try{const nd=await Fs.getDoc(Fs.doc(db,'names',l));if(nd.exists()&&nd.data().uid!==uid)old=nd.data().uid}catch(x){}
    bt.set(Fs.doc(db,'users',uid),{name,nameLower:l,login:l,status:'online',last:Date.now(),created:Date.now(),approved:l===ADMIN_LOGIN});bt.set(Fs.doc(db,'names',l),{uid});
    if(old){const od=await Fs.getDoc(Fs.doc(db,'users',old));if(od.exists())bt.delete(od.ref)}
    await bt.commit();return{uid,name,st:l===ADMIN_LOGIN?'ok':'pending'}}
   catch(e){try{await Au.deleteUser(c.user)}catch(x){}throw new Error(e.code==='permission-denied'?'Name bereits vergeben oder Firestore-Regeln nicht aktuell.':'Registrierung fehlgeschlagen.')}finally{busy=false}},
  async login(name,pw){let c;try{c=await Au.signInWithEmailAndPassword(auth,mail(name),pw)}catch(e){throw fe(e)}
   const pr=await prof(c.user);if(!pr){try{await Au.signOut(auth)}catch(x){}throw new Error('Dein Profil wurde entfernt und der Name ist inzwischen vergeben.')}return pr},
  async removeChat(id){await Fs.deleteDoc(Fs.doc(db,'chats',id))},
  async sendInvite(me,o,game,s){const gref=Fs.doc(Fs.collection(db,'games')),iref=Fs.doc(Fs.collection(db,'invites'));
   await Fs.setDoc(gref,{game,players:[me.uid,o.uid],names:{[me.uid]:me.name,[o.uid]:o.name},s,rev:0,status:'waiting',ts:Date.now()});
   await Fs.setDoc(iref,{from:me.uid,fromName:me.name,to:o.uid,toName:o.name,members:[me.uid,o.uid],game,gid:gref.id,status:'pending',ts:Date.now()});return{id:iref.id,gid:gref.id}},
  async respondInvite(id,st){await Fs.updateDoc(Fs.doc(db,'invites',id),{status:st})},
  async deleteInvite(id){await Fs.deleteDoc(Fs.doc(db,'invites',id))},
  async deleteGame(gid){await Fs.deleteDoc(Fs.doc(db,'games',gid))},
